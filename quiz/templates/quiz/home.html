<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>資料結構主題測驗網站</title>

    <style>
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #f3f8fb;
            color: #222;
        }

        /* 上方藍色標題列 */
        .topbar {
            height: 72px;
            background-color: #0f2f5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .site-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* 左側選單 */
        .sidebar {
            position: fixed;
            top: 72px;
            left: 0;
            width: 180px;
            height: calc(100vh - 72px);
            background-color: #eef3f8;
            border-right: 1px solid #d6dde5;
            padding-top: 12px;
        }

        .sidebar a {
            display: block;
            padding: 16px 24px;
            color: #333;
            text-decoration: none;
            font-size: 17px;
        }

        .sidebar a:hover {
            background-color: #dfe9f5;
            color: #0f2f5f;
            font-weight: bold;
        }

        .sidebar .active {
            background-color: #dfe9f5;
            color: #0f2f5f;
            font-weight: bold;
        }

        /* 主內容 */
        .main {
            margin-left: 180px;
            padding-top: 72px;
            min-height: 100vh;
        }

        .content {
            max-width: 850px;
            margin: 28px auto;
            text-align: center;
        }

        .welcome {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        /* 白色卡片 */
        .card {
            background: white;
            width: 680px;
            margin: 0 auto;
            padding: 22px 34px;
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18);
            text-align: left;
            font-size: 16px;
        }

        /* 三點式說明 */
        .intro-list {
            text-align: left;
            line-height: 1.55;
            font-size: 16px;
        }

        .intro-item {
            display: grid;
            grid-template-columns: 36px 1fr;
            column-gap: 0;
            margin-bottom: 6px;
        }

        .intro-item:last-child {
            margin-bottom: 0;
        }

        .intro-number {
            color: #0f2f5f;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
            text-align: right;
            padding-right: 8px;
        }

        .intro-title {
            color: #0f2f5f;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .intro-desc {
            font-size: 16px;
            line-height: 1.55;
        }

        .quiz-setting {
            margin-top: 14px;
            margin-bottom: 12px;
            font-size: 18px;
            text-align: center;
        }

        .quiz-setting label {
            font-weight: bold;
        }

        .quiz-setting select {
            padding: 7px 12px;
            margin-left: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #bbb;
        }

        .start-btn {
            display: block;
            margin-top: 12px;
            width: 100%;
            padding: 12px 0;
            background-color: #f05a24;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .start-btn:hover {
            background-color: #d94d1d;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 140px;
            }

            .main {
                margin-left: 140px;
            }

            .card {
                width: 80%;
            }

            .welcome {
                font-size: 30px;
            }

            .site-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <!-- 上方標題列 -->
    <div class="topbar">
        <div class="site-title">資料結構主題測驗網站</div>
    </div>

    <!-- 左側選單 -->
    <div class="sidebar">
        <a href="{% url 'home' %}" class="active">首頁</a>
        <a href="{% url 'quiz' %}">開始測驗</a>
        <a href="{% url 'answer_records' %}">作答記錄</a>
        <a href="{% url 'wrong_review' %}">錯題複習</a>
        <a href="/admin/">題庫管理</a>
    </div>

    <!-- 主內容 -->
    <div class="main">
        <div class="content">
            <div class="welcome">歡迎來到資料結構主題測驗網站</div>

            <div class="section-title">測驗說明</div>

            <div class="card">
                <div class="intro-list">
                    <div class="intro-item">
                        <div class="intro-number">1.</div>
                        <div>
                            <div class="intro-title">提供資料結構主題測驗</div>
                            <div class="intro-desc">
                                題目涵蓋陣列、鏈結串列、堆疊、佇列、樹、圖形、排序與搜尋等單元。
                            </div>
                        </div>
                    </div>

                    <div class="intro-item">
                        <div class="intro-number">2.</div>
                        <div>
                            <div class="intro-title">可自行選擇測驗題數</div>
                            <div class="intro-desc">
                                學生可依需求選擇每次測驗 5 題、10 題、15 題或 20 題。
                            </div>
                        </div>
                    </div>

                    <div class="intro-item">
                        <div class="intro-number">3.</div>
                        <div>
                            <div class="intro-title">支援學習回饋與錯題複習</div>
                            <div class="intro-desc">
                                測驗後會顯示分數、正確答案與解說，並透過作答記錄、錯題複習與間隔學習，
                                幫助學生加強不熟悉的觀念。
                            </div>
                        </div>
                    </div>
                </div>

                <form method="get" action="{% url 'quiz' %}">
                    <div class="quiz-setting">
                        <label for="count">請選擇本次測驗題數：</label>

                        <select name="count" id="count">
                            <option value="5">5 題</option>
                            <option value="10" selected>10 題</option>
                            <option value="15">15 題</option>
                            <option value="20">20 題</option>
                        </select>
                    </div>

                    <button type="submit" class="start-btn">
                        測驗開始
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
